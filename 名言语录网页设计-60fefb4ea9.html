    <style>
        body {

            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: #2d3748;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .quote-container {
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateY(20px);
        }

        .quote-container.active {
            opacity: 1;
            transform: translateY(0);
        }

        .quote-text {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            line-height: 1.6;
            transition: all 0.5s ease;
        }

        .quote-author {
            font-size: clamp(1rem, 3vw, 1.5rem);
            transition: all 0.5s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            outline: none;
            box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px 0 rgba(79, 70, 229, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px 0 rgba(79, 70, 229, 0.3);
        }

        .glassmorphism {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .blob {
            position: absolute;
            background: linear-gradient(135deg, #4299e1 0%, #9f7aea 100%);
            filter: blur(60px);
            opacity: 0.3;
            border-radius: 50%;
            animation: blob-movement 15s infinite linear;
            z-index: -1;
        }

        @keyframes blob-movement {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(5%, -10%) scale(1.3); }
            66% { transform: translate(-15%, 5%) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .quote-icon {
            color: rgba(79, 70, 229, 0.3);
            font-size: clamp(3rem, 10vw, 6rem);
        }

        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 1rem 0;
            text-align: center;
            font-size: 0.875rem;
            color: #64748b;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px 0 rgba(0, 0, 0, 0.15);
        }

        /* 深色模式 */
        body.dark-mode {
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            color: #e2e8f0;
        }

        body.dark-mode .glassmorphism {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(71, 85, 105, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        body.dark-mode .quote-icon {
            color: rgba(129, 140, 248, 0.2);
        }

        body.dark-mode .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 100%);
            box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.2);
        }

        body.dark-mode .btn-primary:hover {
            box-shadow: 0 8px 20px 0 rgba(79, 70, 229, 0.3);
        }

        body.dark-mode .footer {
            color: #94a3b8;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .quote-container {
                padding: 2rem 1.5rem;
                margin: 0 1rem;
            }
            
            .theme-toggle {
                top: 15px;
                right: 15px;
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>

            { text: "伟大的事业，需要决心，能力，组织和责任感。", author: "易卜生" },

            { text: "坚强的信心，能使平凡的人做出惊人的事业。", author: "马尔顿" },
            { text: "立志、工作、成功，是人类活动的三大要素。", author: "巴斯德" },
            { text: "我不如起个磨刀石的作用，能使钢刀锋利，虽然它自己切不动什麽。", author: "贺拉斯" },
            { text: "三军可夺帅也，匹夫不可夺志也。", author: "孔丘" },

            { text: "大鹏一日同风起，扶摇直上九万里。", author: "李白" },
            { text: "古之立大事者，不惟有超世之才，亦必有坚忍不拔之志。", author: "苏轼" },
            { text: "故立志者，为学之心也；为学者，立志之事也。", author: "王阳明" },
            { text: "贫不足羞，可羞是贫而无志。", author: "吕坤" },
            { text: "我们以人们的目的来判断人的活动。目的伟大，活动才可以说是伟大的。", author: "契诃夫" },
            { text: "毫无理想而又优柔寡断是一种可悲的心理。", author: "培根" },
            { text: "生活的理想，就是为了理想的生活。", author: "张闻天" },
            { text: "一个人追求的目标越高，他的才力就发展得越快，对社会就越有益。", author: "高尔基" },
            { text: "有很多人是用青春的幸福作成功代价的。", author: "莫扎特" },
